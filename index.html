<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সৌদি প্রবাসী ম্যাপ | Unseen Saudi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
    }
    body {
      background-color: #f4efe6;
      color: #2b332c;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #124e37;
      font-size: 26px;
      margin-bottom: 5px;
    }
    .header p {
      color: #555;
      font-size: 14px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      max-width: 500px;
    }
    .form-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #124e37;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #124e37;
    }
    button.btn-gen {
      width: 100%;
      background: #124e37;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button.btn-gen:hover {
      background: #0d3827;
    }
    /* Unseen Style Output Card */
    .card-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #unseenCard {
      width: 450px;
      height: 620px;
      background-color: #f7f4ec;
      border: 1px solid #e2ded2;
      border-radius: 12px;
      padding: 25px 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .avatar-box {
      width: 75px;
      height: 75px;
      border-radius: 18px;
      border: 3px solid #124e37;
      overflow: hidden;
      background: #ddd;
      flex-shrink: 0;
    }
    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header-text {
      flex-grow: 1;
    }
    .sub-title {
      font-size: 12px;
      color: #7a827b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .main-title {
      font-size: 22px;
      font-weight: 700;
      color: #124e37;
      line-height: 1.2;
    }
    .loc-info {
      font-size: 14px;
      color: #333;
      margin-top: 4px;
    }
    .map-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 10px 0;
    }
    .map-svg {
      width: 100%;
      max-height: 350px;
    }
    .map-region {
      fill: #e3decb;
      stroke: #ffffff;
      stroke-width: 1.5;
      transition: fill 0.3s;
    }
    .map-region.active {
      fill: #124e37;
    }
    .map-text {
      font-size: 10px;
      fill: #555;
      font-weight: 600;
      pointer-events: none;
      text-anchor: middle;
    }
    .map-text.active-text {
      fill: #ffffff;
      font-weight: 700;
    }
    .pin-point {
      fill: #e74c3c;
      stroke: #ffffff;
      stroke-width: 1.5;
      animation: pulse 1.5s infinite alternate;
    }
    .card-footer {
      border-top: 1px solid #e0dbc8;
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .user-details {
      font-size: 13px;
      color: #444;
      line-height: 1.5;
    }
    .user-details strong {
      color: #124e37;
    }
    .brand-logo {
      text-align: right;
      font-size: 12px;
      font-weight: 700;
      color: #124e37;
    }
    .btn-download {
      background: #27ae60;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      max-width: 450px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>সৌদি প্রবাসী ম্যাপ কার্ড জেনারেটর</h1>
    <p>আপনার তথ্য দিয়ে চমৎকার কার্ড বানিয়ে ডাউনলোড করুন</p>
  </div>

  <div class="container">
    <div class="form-card">
      <div class="form-group">
        <label>আপনার নাম</label>
        <input type="text" id="nameInput" value="ইসমাইল" placeholder="আপনার নাম লিখুন">
      </div>
      <div class="form-group">
        <label>ছবি সিলেক্ট করুন</label>
        <input type="file" id="photoInput" accept="image/*">
      </div>
      <div class="form-group">
        <label>সৌদি আরবের বর্তমান অঞ্চল/শহর</label>
        <select id="cityInput">
          <option value="Riyadh">রিয়াদ (Riyadh)</option>
          <option value="Makkah">মক্কা / জেদ্দা (Makkah / Jeddah)</option>
          <option value="Madinah">মদিনা (Madinah)</option>
          <option value="Eastern">দাম্মাম / আল খোবার (Eastern Province)</option>
          <option value="Tabuk" selected>তবুক (Tabuk)</option>
          <option value="Asir">আভা / খামিস মুশাইত (Asir)</option>
          <option value="Qassim">বুরাইদা / কাসিম (Qassim)</option>
          <option value="Jazan">জিজান (Jazan)</option>
          <option value="Hail">হায়েল (Hail)</option>
          <option value="Najran">নাজরান (Najran)</option>
          <option value="Northern">আরআর / উত্তর অঞ্চল (Northern Borders)</option>
          <option value="Jouf">আল জুফ (Al Jouf)</option>
          <option value="Bahah">আল বাহাহ (Al Bahah)</option>
        </select>
      </div>
      <div class="form-group">
        <label>আপনার পেশা</label>
        <input type="text" id="professionInput" value="বারিস্টা / টেকনিশিয়ান" placeholder="যেমন: ব্যবসা / চাকরি">
      </div>
      <div class="form-group">
        <label>মোবাইল / হোয়াটসঅ্যাপ নম্বর</label>
        <input type="text" id="phoneInput" value="+966 50 000 0000" placeholder="+966...">
      </div>
      <button class="btn-gen" onclick="updateCard()">কার্ড তৈরি করুন</button>
    </div>

    <!-- Generated Card Section -->
    <div class="card-wrapper">
      <div id="unseenCard">
        <div class="card-header">
          <div class="avatar-box">
            <img id="cardPhoto" src="https://via.placeholder.com/150" alt="Profile Photo">
          </div>
          <div class="header-text">
            <div class="sub-title">সৌদি প্রবাসী ম্যাপ</div>
            <div class="main-title">மিস্টার <span id="cardNameTitle">ইসমাইল</span></div>
            <div class="loc-info">সৌদি আরবের <strong id="cardCityName">তবুক</strong> অঞ্চলে আছেন</div>
          </div>
        </div>

        <!-- Saudi Map SVG with City Labels Inside -->
        <div class="map-container">
          <svg class="map-svg" viewBox="0 0 500 450">
            <!-- Regions -->
            <path id="region-Tabuk" class="map-region" d="M80 60 L180 80 L150 160 L70 120 Z" />
            <path id="region-Jouf" class="map-region" d="M180 80 L270 70 L250 140 L150 160 Z" />
            <path id="region-Northern" class="map-region" d="M270 70 L370 80 L340 150 L250 140 Z" />
            <path id="region-Madinah" class="map-region" d="M150 160 L250 140 L230 250 L130 230 Z" />
            <path id="region-Hail" class="map-region" d="M250 140 L340 150 L330 220 L230 250 Z" />
            <path id="region-Qassim" class="map-region" d="M330 220 L390 230 L360 280 L270 260 Z" />
            <path id="region-Eastern" class="map-region" d="M370 80 L480 150 L440 330 L390 230 Z" />
            <path id="region-Riyadh" class="map-region" d="M360 280 L440 330 L380 400 L260 360 Z" />
            <path id="region-Makkah" class="map-region" d="M130 230 L230 250 L200 340 L150 320 Z" />
            <path id="region-Bahah" class="map-region" d="M200 340 L220 340 L210 370 L190 360 Z" />
            <path id="region-Asir" class="map-region" d="M210 370 L260 360 L240 410 L190 390 Z" />
            <path id="region-Jazan" class="map-region" d="M190 390 L220 400 L210 430 L180 410 Z" />
            <path id="region-Najran" class="map-region" d="M260 360 L380 400 L350 430 L240 410 Z" />

            <!-- City Names Inside Regions -->
            <text id="text-Tabuk" x="125" y="115" class="map-text">তবুক</text>
            <text id="text-Jouf" x="210" y="110" class="map-text">আল জুফ</text>
            <text id="text-Northern" x="310" y="115" class="map-text">উত্তর সীমান্ত</text>
            <text id="text-Madinah" x="190" y="195" class="map-text">মদিনা</text>
            <text id="text-Hail" x="290" y="185" class="map-text">হায়েল</text>
            <text id="text-Qassim" x="330" y="250" class="map-text">কাসিম</text>
            <text id="text-Eastern" x="420" y="210" class="map-text">পূর্ব প্রদেশ</text>
            <text id="text-Riyadh" x="350" y="335" class="map-text">রিয়াদ</text>
            <text id="text-Makkah" x="175" y="285" class="map-text">মক্কা</text>
            <text id="text-Bahah" x="205" y="355" class="map-text" style="font-size:8px;">বাহাহ</text>
            <text id="text-Asir" x="225" y="385" class="map-text">আসীর</text>
            <text id="text-Jazan" x="200" y="410" class="map-text" style="font-size:8px;">জিজান</text>
            <text id="text-Najran" x="300" y="395" class="map-text">নাজরান</text>

            <!-- Dynamic Pin -->
            <circle id="mapPin" class="pin-point" cx="125" cy="115" r="7" />
          </svg>
        </div>

        <div class="card-footer">
          <div class="user-details">
            <div><strong>পেশা:</strong> <span id="cardProfession">বারিস্টা / টেকনিশিয়ান</span></div>
            <div><strong>যোগাযোগ:</strong> <span id="cardPhone">+966 50 000 0000</span></div>
          </div>
          <div class="brand-logo">
            📍 Unseen Saudi<br>
            <span style="font-size:10px; font-weight:normal; color:#777;">probashi-map.com</span>
          </div>
        </div>
      </div>

      <button class="btn-download" onclick="downloadCard()">এইচডি কার্ড হিসেবে ডাউনলোড করুন 📥</button>
    </div>
  </div>

  <script>
    const pinCoordinates = {
      'Tabuk': { cx: 125, cy: 115 },
      'Jouf': { cx: 210, cy: 110 },
      'Northern': { cx: 310, cy: 115 },
      'Madinah': { cx: 190, cy: 195 },
      'Hail': { cx: 290, cy: 185 },
      'Qassim': { cx: 330, cy: 250 },
      'Eastern': { cx: 420, cy: 210 },
      'Riyadh': { cx: 350, cy: 335 },
      'Makkah': { cx: 175, cy: 285 },
      'Bahah': { cx: 205, cy: 355 },
      'Asir': { cx: 225, cy: 385 },
      'Jazan': { cx: 200, cy: 410 },
      'Najran': { cx: 300, cy: 395 }
    };

    function updateCard() {
      const name = document.getElementById('nameInput').value || 'ইউজার';
      const citySelect = document.getElementById('cityInput');
      const cityVal = citySelect.value;
      const cityNameText = citySelect.options[citySelect.selectedIndex].text.split(' (')[0];
      const profession = document.getElementById('professionInput').value || 'প্রবাসী';
      const phone = document.getElementById('phoneInput').value || 'N/A';

      // Update Text
      document.getElementById('cardNameTitle').innerText = name;
      document.getElementById('cardCityName').innerText = cityNameText;
      document.getElementById('cardProfession').innerText = profession;
      document.getElementById('cardPhone').innerText = phone;

      // Update Map Active Region & Text Style
      document.querySelectorAll('.map-region').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.map-text').forEach(el => el.classList.remove('active-text'));

      const activeRegion = document.getElementById('region-' + cityVal);
      if (activeRegion) {
        activeRegion.classList.add('active');
      }

      const activeText = document.getElementById('text-' + cityVal);
      if (activeText) {
        activeText.classList.add('active-text');
      }

      // Update Pin Position
      const pin = document.getElementById('mapPin');
      if (pinCoordinates[cityVal]) {
        pin.setAttribute('cx', pinCoordinates[cityVal].cx);
        pin.setAttribute('cy', pinCoordinates[cityVal].cy);
      }

      // Update Photo
      const photoInput = document.getElementById('photoInput');
      if (photoInput.files && photoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('cardPhoto').src = e.target.result;
        }
        reader.readAsDataURL(photoInput.files[0]);
      }
    }

    function downloadCard() {
      const card = document.getElementById('unseenCard');
      html2canvas(card, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'saudi-probashi-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // Initialize map state
    updateCard();
  </script>
</body>
</html>
